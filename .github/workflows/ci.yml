name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # A java-library — compile + the small unit tests (Csv parsing, tag
      # normalisation). No Docker image: nothing runs this on its own; the two
      # catalogues pull it in via a Gradle composite build.
      - run: ./gradlew build
